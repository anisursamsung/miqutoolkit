# Do not edit this file inside /usr/share/miqutoolkit/.

background = #f4fbf880
on_background = #171d1b
surface = #f4fbf880
on_surface = #000000
surface_variant = #dae5e1
on_surface_variant = #252f2c
primary = #003c34
on_primary = #ffffff
primary_container = #107164
on_primary_container = #ffffff
outline = #424c49
